<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>

<div class="auth-wrap">
  <div class="auth-art"><span class="mstripe" style="margin-bottom:18px"><i></i><i></i><i></i></span><h2>Welcome back</h2><p class="muted">Log in to manage your cart, wishlist, test drives and orders.</p></div>
  <div class="auth-form"><form id="login-form" novalidate>
    <h2>Log in</h2><div class="form-msg" id="msg"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-block" type="submit">Log in</button>
    <p class="muted" style="margin-top:16px">New here? <a href="/register.html">Create an account</a></p>
  </form></div>
</div>
</main>
<div id="site-footer"></div>
<script src="/config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
